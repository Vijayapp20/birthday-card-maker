# ── Server ─────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── CORS ───────────────────────────────────────────────────────────
# Comma-separated list, e.g.: http://localhost:5173,https://your-app.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── MySQL DataSource ────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────
# "update" lets Hibernate create/alter tables automatically. Once your tables exist and match
# schema.sql, set DDL_AUTO=validate on Render so production never changes the schema by itself.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Spring AI → Groq ────────────────────────────────────────────────
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
# llama-3.1-8b-instant is fast and cheap - plenty for a 50-60 word message.
# Override with the GROQ_MODEL env var if Groq retires it (see console.groq.com/docs/models).
spring.ai.openai.chat.options.model=${GROQ_MODEL:llama-3.1-8b-instant}
spring.ai.openai.chat.options.temperature=0.8
spring.ai.openai.chat.options.max-tokens=300

# ── Cloudinary (cloud photo storage) ────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ── File Upload ─────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ── Rate limiting (see RateLimitFilter) ─────────────────────────────
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# ── Never leak internals in default error responses ─────────────────
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
